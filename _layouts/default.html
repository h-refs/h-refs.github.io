<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} — {{ site.title }}</title>
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicon-16.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/favicon-180.png' | relative_url }}">
</head>
<body>
  <div class="topbar">
    <a class="topbar-title" id="shelf-swap" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <div class="dropdown">
      <button type="button" aria-haspopup="true" aria-expanded="false">Menu ▾</button>
      <ul class="dropdown-menu">
        <li><a href="{{ '/' | relative_url }}">Home</a></li>
        <li><a href="{{ '/about' | relative_url }}">About</a></li>
        <li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li>
        <li><a href="https://github.com/h-refs">About me</a></li>
      </ul>
    </div>
  </div>
  {% if page.layout != "post" %}
  <header>
    <a class="title" href="{{ '/' | relative_url }}"><h1>{{ site.title }}</h1></a>
  </header>
  {% endif %}
  <main>
    {{ content }}
  </main>
  <footer>
    <p>© {{ site.time | date: "%Y" }} {{ site.title }} · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
  </footer>
  <script>
    (function () {
      // Option A: post title and site title share the shelf slot; tap scrolls to
      // top of article while the post title is shown, then goes home afterwards.
      var slot = document.getElementById('shelf-swap');
      if (!slot) return;
      var h1 = document.querySelector('main > h1');
      var site = document.createElement('span');
      site.className = 'slot-site';
      site.textContent = {{ site.title | jsonify }};
      var post = h1 ? (function () {
        var s = document.createElement('span');
        s.className = 'slot-post';
        s.textContent = h1.textContent;
        return s;
      })() : null;
      slot.textContent = '';
      slot.appendChild(site);
      if (post) slot.appendChild(post);
      var swapped = false;
      function onScroll() {
        var show = h1 && h1.getBoundingClientRect().bottom < 56;
        if (show !== swapped) {
          swapped = show;
          slot.classList.toggle('swapped', show);
        }
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
      if (post) {
        slot.addEventListener('click', function (e) {
          if (swapped) {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        });
      }
      document.querySelectorAll('.dropdown').forEach(function (d) {
        var btn = d.querySelector('button');
        btn.addEventListener('click', function () {
          var open = d.classList.toggle('open');
          btn.setAttribute('aria-expanded', open);
        });
        document.addEventListener('click', function (e) {
          if (!d.contains(e.target)) { d.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); }
        });
      });
    })();
  </script>
</body>
</html>
