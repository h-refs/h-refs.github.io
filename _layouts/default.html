<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} — {{ site.title }}</title>
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <div class="topbar">
    <a class="topbar-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <div class="shelf-title" id="shelf-title" aria-hidden="true"></div>
    <div class="dropdown">
      <button type="button" aria-haspopup="true" aria-expanded="false">Menu ▾</button>
      <ul class="dropdown-menu">
        <li><a href="{{ '/' | relative_url }}">Home</a></li>
        <li><a href="{{ '/about' | relative_url }}">About</a></li>
        <li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li>
        <li><a href="https://github.com/h-refs">About me</a></li>
      </ul>
    </div>
  </div>
  {% if page.layout != "post" %}
  <header>
    <a class="title" href="{{ '/' | relative_url }}"><h1>{{ site.title }}</h1></a>
  </header>
  {% endif %}
  <main>
    {{ content }}
  </main>
  <footer>
    <p>© {{ site.time | date: "%Y" }} {{ site.title }} · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
  </footer>
  <script>
    (function () {
      var h1 = document.querySelector('main > h1');
      var shelf = document.getElementById('shelf-title');
      if (h1 && shelf) {
        shelf.textContent = h1.textContent;   // set once, always present
        var gap0 = 1;
        function measure() {
          var r = h1.getBoundingClientRect();
          gap0 = Math.max(1, (r.top + window.scrollY) - shelf.getBoundingClientRect().bottom);
        }
        function onScroll() {
          var r = h1.getBoundingClientRect();
          var sr = shelf.getBoundingClientRect();
          var p = Math.min(1, Math.max(0, 1 - (r.top - sr.bottom) / gap0));
          h1.classList.toggle('hidden-for-flight', p > 0.18);
          shelf.style.opacity = Math.max(0, Math.min(1, (p - 0.6) / 0.4));
          if (p >= 0.98) h1.classList.add('hidden-for-flight');
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', function () { measure(); onScroll(); });
        measure();
        onScroll();
      }
      document.querySelectorAll('.dropdown').forEach(function (d) {
        var btn = d.querySelector('button');
        btn.addEventListener('click', function () {
          var open = d.classList.toggle('open');
          btn.setAttribute('aria-expanded', open);
        });
        document.addEventListener('click', function (e) {
          if (!d.contains(e.target)) { d.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); }
        });
      });
    })();
  </script>
</body>
</html>
