<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} — {{ site.title }}</title>
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <div class="topbar">
    <a class="topbar-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <div class="shelf-title" id="shelf-title" aria-hidden="true"></div>
    <div class="dropdown">
      <button type="button" aria-haspopup="true" aria-expanded="false">Menu ▾</button>
      <ul class="dropdown-menu">
        <li><a href="{{ '/' | relative_url }}">Home</a></li>
        <li><a href="{{ '/about' | relative_url }}">About</a></li>
        <li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li>
        <li><a href="https://github.com/h-refs">About me</a></li>
      </ul>
    </div>
  </div>
  {% if page.layout != "post" %}
  <header>
    <a class="title" href="{{ '/' | relative_url }}"><h1>{{ site.title }}</h1></a>
  </header>
  {% endif %}
  <main>
    {{ content }}
  </main>
  <footer>
    <p>© {{ site.time | date: "%Y" }} {{ site.title }} · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
  </footer>
  <script>
    (function () {
      // post-title flight: mirror the h1, ease it into the shelf centre
      var h1 = document.querySelector('main > h1');
      var shelf = document.getElementById('shelf-title');
      if (h1 && shelf) {
        var flying = document.createElement('div');
        flying.className = 'post-title-flying';
        flying.textContent = h1.textContent;
        document.body.appendChild(flying);
        var w0 = 1, gap0 = 1, s1 = 1;
        function measure() {
          var h1Rect = h1.getBoundingClientRect();
          w0 = h1.offsetWidth;
          flying.style.width = w0 + 'px';
          flying.style.fontSize = getComputedStyle(h1).fontSize;
          s1 = 15.2 / parseFloat(getComputedStyle(h1).fontSize); // shrink to shelf size
          gap0 = (h1Rect.top + window.scrollY) - shelf.getBoundingClientRect().bottom;
          gap0 = Math.max(1, gap0);
        }
        function onScroll() {
          var h1Rect = h1.getBoundingClientRect();
          var shelfRect = shelf.getBoundingClientRect();
          var gap = h1Rect.top - shelfRect.bottom;
          var p = Math.min(1, Math.max(0, 1 - gap / gap0));
          if (p > 0) {
            var scale = 1 + (s1 - 1) * p;
            var w = w0 * scale;
            var hgt = flying.offsetHeight * scale;
            var x1 = shelfRect.left + (shelfRect.width - w) / 2;
            var y1 = shelfRect.top + (shelfRect.height - hgt) / 2;
            var x = h1Rect.left + (x1 - h1Rect.left) * p;
            var y = h1Rect.top + (y1 - h1Rect.top) * p;
            flying.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + scale + ')';
            flying.style.opacity = Math.min(1, p * 1.8);
            h1.classList.add('hidden-for-flight');
          } else {
            flying.style.opacity = 0;
            h1.classList.remove('hidden-for-flight');
          }
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', function () { measure(); onScroll(); });
        measure();
        onScroll();
      }
      document.querySelectorAll('.dropdown').forEach(function (d) {
        var btn = d.querySelector('button');
        btn.addEventListener('click', function () {
          var open = d.classList.toggle('open');
          btn.setAttribute('aria-expanded', open);
        });
        document.addEventListener('click', function (e) {
          if (!d.contains(e.target)) { d.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); }
        });
      });
    })();
  </script>
</body>
</html>
